name: Promote container latest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to promote (for example v3.0.0-beta.5)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-container-latest
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/soerennb/extplorer3

jobs:
  promote:
    name: Promote verified release to latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Promote and verify manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          version="${RELEASE_TAG#v}"
          release_ref="${IMAGE_NAME}:${version}"
          release_manifest="$(docker buildx imagetools inspect "$release_ref")"
          release_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$release_manifest")"
          test -n "$release_digest"
          grep -q 'linux/amd64' <<< "$release_manifest"
          grep -q 'linux/arm64' <<< "$release_manifest"

          case "$RELEASE_TAG" in
            v*-*)
              newest_prerelease_tag="$({
                git ls-remote --tags --refs "https://github.com/${REPOSITORY}.git" \
                  | awk -F/ '$3 ~ /^v[0-9]+\.[0-9]+\.[0-9]+-.+$/ { print $3 }' \
                  | sort -V \
                  | tail -n 1
              } || true)"
              test "$RELEASE_TAG" = "$newest_prerelease_tag"
              ;;
          esac

          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "$release_ref"

          latest_manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest")"
          latest_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$latest_manifest")"
          test "$release_digest" = "$latest_digest"
          grep -q 'linux/amd64' <<< "$latest_manifest"
          grep -q 'linux/arm64' <<< "$latest_manifest"
