name: Promote container latest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to promote (for example v3.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/soerennb/extplorer3

jobs:
  promote:
    name: Promote verified release to latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Promote and verify stable aliases with rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-publication.cjs promote
