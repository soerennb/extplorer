name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, intl, mbstring, xml, zip
          tools: composer:2.10.2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: Check PHP syntax
        if: matrix.php == '8.2'
        run: find app tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: composer test

  i18n:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Build translations
        run: node scripts/build-i18n.js

      - name: Check translations
        run: node scripts/check-i18n.js

      - name: Verify generated translations are committed
        run: git diff --exit-code -- public/assets/i18n

  docker:
    name: Docker + Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: extplorer-e2e
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_USERNAME: e2e-admin
      E2E_PASSWORD: e2e-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: extplorer3:e2e
          build-args: APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install E2E dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          npm run e2e:install

      - name: Start E2E stack
        run: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.yml up --detach --wait --wait-timeout 120

      - name: Run Chromium smoke tests
        run: npm run e2e

      - name: Collect container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.yml logs --no-color > e2e-compose.log

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            e2e-compose.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.yml down --volumes --remove-orphans
