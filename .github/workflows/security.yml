name: Security audit

on:
  pull_request:
    paths:
      - 'app/**'
      - 'public/**'
      - 'resources/**'
      - 'tests/**'
      - 'scripts/**'
      - 'writable/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.nvmrc'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'nginx.conf.example'
      - 'spark'
      - 'env'
      - 'preload.php'
      - '.htaccess'
      - 'build.sh'
      - 'phpstan*'
      - 'phpunit*'
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'public/**'
      - 'resources/**'
      - 'tests/**'
      - 'scripts/**'
      - 'writable/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.nvmrc'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'nginx.conf.example'
      - 'spark'
      - 'env'
      - 'preload.php'
      - '.htaccess'
      - 'build.sh'
      - 'phpstan*'
      - 'phpunit*'
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  security-regression:
    name: Native security regression suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: curl, dom, gd, intl, mbstring, sqlite3, xml, zip
          tools: composer:2.10.2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run VFS, archive, remote and installation security tests
        run: >-
          vendor/bin/phpunit --no-coverage
          tests/unit/PathPolicyTest.php
          tests/unit/RemoteEndpointPolicyTest.php
          tests/unit/RemoteSecurityPolicyTest.php
          tests/unit/VirtualVfsTest.php
          tests/unit/VfsFactoryMountTest.php
          tests/unit/LocalAdapterSecurityTest.php
          tests/unit/InstallStateServiceTest.php

  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub workflows
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  runtime-policy:
    name: Container runtime policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose and runtime hardening
        run: |
          docker compose config --quiet
          test "$(docker compose config --format json | jq -r '.services["extplorer-app"].user')" = "82:82"
          test "$(docker compose config --format json | jq -r '.services["extplorer-app"].read_only')" = "true"
          test "$(docker compose config --format json | jq -r '.services["extplorer-web"].read_only')" = "true"
          test "$(docker compose config --format json | jq -r '.services["extplorer-web"].healthcheck.test[1]')" = "wget -q -O /dev/null http://127.0.0.1/health"
          ! rg -n 'EXTPLORER_(ADMIN_PASS|ENCRYPTION_KEY|SMTP_PASS|DB_PASSWORD|REDIS_PASSWORD):' docker-compose*.yml

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          tools: composer:2.10.2
          coverage: none

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Audit locked NPM dependencies
        run: npm audit --package-lock-only --audit-level=high

  container:
    name: Container vulnerability scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: extplorer3:security
          build-args: APP_VERSION=security
          cache-from: type=gha,scope=extplorer-image-amd64
          cache-to: type=gha,mode=max,scope=extplorer-image-amd64

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: extplorer3:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
