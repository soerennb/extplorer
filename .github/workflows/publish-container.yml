name: Publish container image

on:
  workflow_call:
    outputs:
      manifest_digest:
        description: Verified immutable multi-architecture manifest digest
        value: ${{ jobs.manifest.outputs.manifest_digest }}
    inputs:
      release_tag:
        description: Immutable Git tag to publish (for example v3.0.0)
        required: true
        type: string
      force_qemu:
        description: Build arm64 through QEMU instead of the native arm64 runner
        required: false
        default: false
        type: boolean
      publish_latest:
        description: Promote an already published release to the moving 3.x/3/latest aliases
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish (for example v3.0.0)
        required: true
        type: string
      force_qemu:
        description: Build arm64 through QEMU instead of the native arm64 runner
        required: false
        default: false
        type: boolean
      publish_latest:
        description: Promote an already published release to the moving 3.x/3/latest aliases
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/soerennb/extplorer3

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ inputs.force_qemu && 'ubuntu-24.04' || matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          actual_version="$(sed -nE "s/^[[:space:]]*public[[:space:]]+string[[:space:]]+\\\$version[[:space:]]*=[[:space:]]*'([^']+)';/\1/p" app/Config/App.php)"
          test -n "$actual_version"
          test "$actual_version" = "$expected_version"
          echo "version=$expected_version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.force_qemu && matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Ensure Ace assets
        run: |
          bash ./scripts/ensure-ace-assets.sh
          test -s public/assets/vendor/ace/ace.min.js

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=extplorer-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=extplorer-image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify runtime package and image smoke suite
        env:
          VERIFIED_IMAGE: ghcr.io/soerennb/extplorer3@${{ steps.build.outputs.digest }}
          COMPOSE_PROJECT_NAME: release-${{ github.run_id }}-${{ matrix.arch }}
          EXTPLORER_IMAGE_REF: ghcr.io/soerennb/extplorer3@${{ steps.build.outputs.digest }}
          EXTPLORER_BASE_URL: http://127.0.0.1:8080/
        run: |
          docker pull "$VERIFIED_IMAGE"
          # shellcheck disable=SC2016
          docker run --rm --entrypoint sh "$VERIFIED_IMAGE" -ec '
            package="$(apk list --installed nghttp2-libs | cut -d " " -f1)"
            version="${package#nghttp2-libs-}"
            test -n "$version"
            printf "nghttp2-libs=%s\n" "$version"
            comparison="$(apk version -t "$version" 1.70.0-r0)"
            test "$comparison" = "=" || test "$comparison" = ">"
          '
          npm ci
          npm run e2e:install
          bash tests/e2e/release-image-smoke.sh "$VERIFIED_IMAGE"

      - name: Scan the actual release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/soerennb/extplorer3@${{ steps.build.outputs.digest }}
          format: json
          output: container-scan.json
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
          ignore-unfixed: false
      - name: Enforce scan policy and nghttp2 fix
        run: |
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == "CVE-2026-58055" or ((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != ""))] | length == 0' container-scan.json
      - name: Retain architecture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-verification-${{ matrix.arch }}
          path: |
            container-scan.json
            playwright-report/
            test-results/
          retention-days: 30
          overwrite: true

      - name: Record image digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  manifest:
    name: Create multi-architecture manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.manifest_digest }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-digest-amd64
          path: digests

      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-digest-arm64
          path: digests

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create immutable version manifest
        id: manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release-publication.cjs manifest
      - name: Retain manifest evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-manifest
          path: manifest.json
          retention-days: 30
          overwrite: true

  promote:
    name: Promote already published stable release
    needs: manifest
    if: inputs.publish_latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote verified published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-publication.cjs promote
