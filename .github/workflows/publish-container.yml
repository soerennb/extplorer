name: Publish existing container tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable release tag to publish (for example v3.0.0-beta.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  container:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          APP_VERSION="${RELEASE_TAG#v}"
          php scripts/check-release-version.php "$APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Ensure Ace assets
        run: bash ./scripts/ensure-ace-assets.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/soerennb/extplorer3:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          progress: plain
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
