name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Verify existing gates for release SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_reusable: ${{ steps.checks.outputs.checks_reusable }}
      checked_sha: ${{ steps.checks.outputs.checked_sha }}
    steps:
      - name: Verify successful main checks
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

          if ! runs_json="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100")"; then
            echo "Unable to query GitHub Actions runs; falling back to full release gates." >&2
            echo "checks_reusable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          required_workflows='["Quality", "Security audit", "Secret scanning"]'
          if jq -e --argjson required "$required_workflows" '
            ([.workflow_runs[]
              | select(.event == "push" and .head_branch == "main" and .conclusion == "success")
              | .name] | unique) as $successful
            | ($required - $successful) | length == 0
          ' <<< "$runs_json" >/dev/null; then
            echo "checks_reusable=true" >> "$GITHUB_OUTPUT"
            echo "Reusable checks found for $RELEASE_SHA."
          else
            echo "checks_reusable=false" >> "$GITHUB_OUTPUT"
            echo "Missing successful same-SHA checks; full release gates will run."
          fi

  quality:
    name: Quality gate
    needs: release-preflight
    if: needs.release-preflight.outputs.checks_reusable != 'true'
    uses: ./.github/workflows/quality.yml

  security:
    name: Security gate
    needs: [release-preflight, quality]
    if: >-
      always() &&
      needs.release-preflight.outputs.checks_reusable != 'true' &&
      needs.quality.result == 'success'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      checks: read

  secret:
    name: Secret gate
    needs: release-preflight
    if: needs.release-preflight.outputs.checks_reusable != 'true'
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
      pull-requests: read
      statuses: write

  archive:
    name: Create deployable archive
    needs: [release-preflight, quality, security, secret]
    if: >-
      always() &&
      needs.release-preflight.result == 'success' &&
      (
        needs.release-preflight.outputs.checks_reusable == 'true' ||
        (
          needs.quality.result == 'success' &&
          needs.security.result == 'success' &&
          needs.secret.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: zip, json, gd, ftp
          tools: composer:2.10.2

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Verify release version
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          php scripts/check-release-version.php "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Ensure Ace assets
        run: bash ./scripts/ensure-ace-assets.sh

      - name: Create archive
        run: |
          VERSION="$APP_VERSION"
          mkdir -p release/writable/cache/thumbs release/writable/cache/dav
          mkdir -p release/writable/config
          mkdir -p release/writable/logs
          mkdir -p release/writable/session
          mkdir -p release/writable/uploads/temp release/writable/uploads/shares release/writable/uploads/chunks
          mkdir -p release/writable/file_manager_root
          mkdir -p release/writable/shared
          mkdir -p release/writable/trash
          mkdir -p release/writable/versions release/writable/runtime release/writable/backups
          cp writable/.htaccess writable/index.html release/writable/
          cp -r app release/
          cp -r public release/
          cp -r vendor release/
          cp LICENSE.md README.md .htaccess nginx.conf.example release/
          cd release && zip -r "../eXtplorer-${VERSION}-release.zip" .

      - name: Verify archive and create checksum
        run: |
          unzip -t "eXtplorer-${GITHUB_REF_NAME#v}-release.zip"
          sha256sum "eXtplorer-${GITHUB_REF_NAME#v}-release.zip" > "eXtplorer-${GITHUB_REF_NAME#v}-release.zip.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            eXtplorer-*-release.zip
            eXtplorer-*-release.zip.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  container:
    name: Publish container image
    needs: [release-preflight, quality, security, secret]
    if: >-
      always() &&
      needs.release-preflight.result == 'success' &&
      (
        needs.release-preflight.outputs.checks_reusable == 'true' ||
        (
          needs.quality.result == 'success' &&
          needs.security.result == 'success' &&
          needs.secret.result == 'success'
        )
      )
    uses: ./.github/workflows/publish-container.yml
    with:
      release_tag: ${{ github.ref_name }}
      publish_latest: true
    permissions:
      contents: read
      packages: write
